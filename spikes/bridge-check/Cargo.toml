[package]
name = "vow-bridge-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
external-signature-program = { git = "https://github.com/0xRigel-squads/external-signature-program", rev = "9d49672f837f0615f321927975375694fb032e56" }
borsh = "1.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
litesvm = "0.6.1"
solana-keypair = "2.2.1"
solana-message = "2.2.1"
solana-pubkey = "2.2.1"
solana-signer = "2.2.1"
solana-transaction = "2.2.1"
solana-instruction = "2.2.1"
solana-slot-hashes = "2.2.1"
solana-hash = "2.2.1"
solana-sdk-ids = "2.2.1"
solana-secp256r1-program = "2.2.1"
