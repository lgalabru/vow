name: Website

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web.yml', 'Justfile']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web.yml', 'Justfile']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: extractions/setup-just@v3
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: just web-check
      - run: just web-build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: just web-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: apps/web/test-results
          retention-days: 7
