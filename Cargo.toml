[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/replay", "crates/simulation"]
exclude = ["spikes/bridge-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
bincode = "1.3.3"
solana-transaction = { version = "=2.2.1", features = ["serde"] }
